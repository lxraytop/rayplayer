name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.5.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        # `npm ci` requires package-lock.json to contain every package of the current platform's
        # ideal tree, but this lock only carries the Windows optional-dependency entries while the
        # parent packages (e.g. @tailwindcss/oxide, lightningcss) declare all 12 platform variants.
        # The lock cannot be regenerated either: a from-scratch resolve fails with ERESOLVE
        # (react 19.3.x vs @react-three/fiber's `>=19 <19.3` peer range), and
        # `npm install --package-lock-only` silently drops the lock's root `overrides` block.
        # So keep the reproducible `ci` path when it validates, and fall back to `install`, which
        # fills in the missing platform packages from the declared optionalDependencies.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Install Rust toolchain
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo build
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .windowtolayer-src

      - name: Build windowtolayer from upstream + patch (Linux only)
        if: runner.os == 'Linux'
        run: |
          # Shared with local `npm run build:electron*`: fetches the pinned upstream source,
          # applies packaging/linux/patches/windowtolayer-popup-resilience.patch (git apply fails loudly instead
          # of shipping a broken build if the revision drifts) and produces
          # build/windowtolayer + build/windowtolayer-COPYING for extraResources.
          node packaging/linux/build-windowtolayer.mjs

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Stamp version metadata
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const pkg=require('./package.json'); pkg.version=process.env.TARGET_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          MACOS_UNSIGNED_HELP_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/desktop/macos-app-damaged.md
        run: |
          node <<'NODE'
          const fs = require('fs');
          const template = fs.readFileSync('.github/release-draft-template.md', 'utf8');
          const replacements = {
            VERSION: process.env.RELEASE_VERSION,
            TAG: process.env.RELEASE_TAG,
            MACOS_UNSIGNED_HELP_URL: process.env.MACOS_UNSIGNED_HELP_URL,
          };
          const notes = Object.entries(replacements).reduce((text, [key, value]) => text.split(`{{${key}}}`).join(value || ''), template);
          fs.mkdirSync('build', { recursive: true });
          fs.writeFileSync('build/release-notes.md', `${notes.trim()}\n`);
          NODE

      - name: Build web app for Electron
        env:
          ELECTRON: 'true'
          APP_VERSION_LABEL: stable
          APP_RELEASE_CHANNEL: stable
        run: npm run build

      - name: Package Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        # macOS is built for Apple Silicon only. `build.mac.target` in package.json still keeps
        # x64 + arm64 so a local Mac build stays universal; CI narrows it to one arch so the
        # release ships a single .dmg. Drop the `--arch` override here to publish both again.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac --arm64 --publish never
          else
            npx electron-builder --publish never
          fi

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.yml
            !release/builder-debug.yml
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            build/release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          NOTES_FILE=$(find release-artifacts -type f -name 'release-notes.md' | head -n 1)
          mapfile -d '' files < <(find release-artifacts -type f ! -name 'release-notes.md' -print0)

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists, uploading assets..."
            gh release upload "${RELEASE_TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            echo "Creating release ${RELEASE_TAG}..."
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Ray v${RELEASE_TAG#v}" \
              --notes-file "${NOTES_FILE}" \
              --target "${GITHUB_SHA}"
          fi

  publish-aur:
    name: Publish AUR package
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check AUR secrets
        id: aur-secrets
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_REPO_SSH_URL: ${{ secrets.AUR_REPO_SSH_URL }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" || -z "${AUR_REPO_SSH_URL}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare AUR metadata
        if: steps.aur-secrets.outputs.configured == 'true'
        run: ./packaging/aur/ray-player-bin/update.sh "${{ steps.version.outputs.version }}"

      - name: Set up SSH key
        if: steps.aur-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

      - name: Push package to AUR
        if: steps.aur-secrets.outputs.configured == 'true'
        shell: bash
        env:
          AUR_REPO_SSH_URL: ${{ secrets.AUR_REPO_SSH_URL }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone "${AUR_REPO_SSH_URL}" aur-repo
          cp packaging/aur/ray-player-bin/PKGBUILD aur-repo/PKGBUILD
          cp packaging/aur/ray-player-bin/.SRCINFO aur-repo/.SRCINFO
          cp packaging/aur/ray-player-bin/ray-player.desktop aur-repo/ray-player.desktop
          cp packaging/aur/ray-player-bin/ray-player.png aur-repo/ray-player.png
          cd aur-repo
          if git diff --quiet -- PKGBUILD .SRCINFO ray-player.desktop ray-player.png; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO ray-player.desktop ray-player.png
          git commit -m "Update to v${RELEASE_VERSION}"
          git push
