services:
  gateway:
    image: ray-local/web:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/gateway.Dockerfile
      args:
        VCS_REF: ${RAY_BUILD_VCS_REF:-local}
        STACK_VERSION: ${RAY_STACK_VERSION:-local}

  backend:
    image: ray-local/web-api:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/backend.Dockerfile

  netease-api:
    image: ray-local/netease-api:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/netease-api.Dockerfile

  kugou-api:
    image: ray-local/kugou-api:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/kugou-api.Dockerfile

  sync-server:
    image: ray-local/sync-server:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/sync-server.Dockerfile
